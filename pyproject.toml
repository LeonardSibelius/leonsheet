[project]
name = "leonsheet"
version = "1.0.0"
description = "Excel in the browser. v1.0: grid + formulas + dependency graph + persistence."
requires-python = ">=3.11"
authors = [{ name = "Leonard Sibelius" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
